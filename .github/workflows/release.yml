name: release

# Runs only after ci finishes. A red test suite must not put an image on the
# registry or a tag into the gitops repo.
#
# workflow_run has no `paths:` filter, and does not need one — the changes job
# below decides what to build.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, master]

permissions: {}

env:
  TRIVY_VERSION: "0.74.0"
  GITOPS_REPO: nginnu/rabbit-gitops
  # For workflow_run, GITHUB_SHA is the last commit on the default branch, not
  # the commit ci just tested. Using it would tag an image with a sha whose code
  # is not inside it.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  # Which services this commit actually touched. Without this every push
  # rebuilds all five, every service gets a new tag, and rolling one back drags
  # its four siblings with it — the charts are separate releases precisely so
  # that cannot happen.
  changes:
    name: changes · which services
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      services: ${{ steps.detect.outputs.services }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The diff below needs the parent commit present. The default shallow
          # clone has only the tip and every path comes back as changed.
          fetch-depth: 0

      - id: detect
        env:
          # The parent of the tested commit. A push carrying several commits at
          # once is compared against the last one only, so a service touched by
          # an earlier commit in that push keeps its old tag until something
          # else rebuilds it.
          BEFORE: ${{ github.event.workflow_run.head_sha }}^
        run: |
          set -euo pipefail
          all="auth catalog order payment notification"

          # A force-push leaves BEFORE pointing at a commit that is no longer
          # reachable, and the first push to a branch sets it to all zeros.
          # git diff against either one exits non-zero and the release would end
          # having built nothing, with no failure to show for it.
          if [ -z "${BEFORE:-}" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "base ${BEFORE:-<empty>} unusable — building every service"
            changed="$all"
          else
            git diff --name-only "$BEFORE" "$SHA" > changed-files.txt
            changed=""
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                shop-api/cmd/auth/*|shop-api/internal/auth/*)       changed="$changed auth" ;;
                shop-api/cmd/catalog/*|shop-api/internal/catalog/*) changed="$changed catalog" ;;
                shop-api/cmd/order/*|shop-api/internal/order/*)     changed="$changed order" ;;
                shop-api/cmd/payment/*|shop-api/internal/payment/*) changed="$changed payment" ;;
                # Anything else under shop-api is shared by all four binaries:
                # internal/shared, go.mod, go.sum, the Dockerfile. Listing them
                # one by one means a file added later matches nothing and its
                # service silently stops being built.
                shop-api/*)                                         changed="$changed auth catalog order payment" ;;
                notification-api/*)                                 changed="$changed notification" ;;
                .github/workflows/release.yml)                      changed="$changed $all" ;;
              esac
            done < changed-files.txt
          fi

          changed=$(printf '%s' "$changed" | tr ' ' '\n' | sort -u | xargs)

          entries=""
          for svc in $changed; do
            case "$svc" in
              # Its own module and its own Dockerfile, so no SVC arg to pass.
              notification) entry='{"service":"notification","context":"notification-api","svc":""}' ;;
              # Four binaries out of one module, selected by the SVC build arg
              # the Dockerfile already takes. One context, four images.
              *)            entry="{\"service\":\"${svc}\",\"context\":\"shop-api\",\"svc\":\"${svc}\"}" ;;
            esac
            entries="${entries:+${entries},}${entry}"
          done

          echo "matrix=[${entries}]" >> "$GITHUB_OUTPUT"
          echo "services=${changed}" >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### services to release"
            echo '```'
            echo "${changed:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build · ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: meta
        run: |
          echo "tag=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The cache is scoped per service. One shared scope has five parallel
      # builds overwriting each other's manifest and every build missing.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rabbit-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          build-args: |
            SVC=${{ matrix.svc }}
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ github.event.workflow_run.head_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: false

      - name: install trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy

      # Scanning the pushed image, not the source: this is the layer set that
      # will actually run, base image included. shop-api ships on alpine, which
      # carries CVEs the Go module graph knows nothing about.
      - name: trivy image
        run: |
          trivy image \
            "${{ secrets.DOCKERHUB_USERNAME }}/rabbit-${{ matrix.service }}:${{ steps.meta.outputs.tag }}" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format sarif \
            --output trivy-${{ matrix.service }}.sarif

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-image-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 14

  # Writes only the services `changes` selected. Rewriting all five would pin
  # the four that were not rebuilt to a tag that exists nowhere, and they would
  # come back ErrImagePull on a commit that never touched them.
  promote:
    name: promote · gitops
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Two releases in flight would both push to the same branch of the same
    # repo. Not cancel-in-progress: the older one may already have pushed.
    concurrency:
      group: promote-gitops
      cancel-in-progress: false
    steps:
      - name: checkout gitops
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          # GITHUB_TOKEN is scoped to this repository only — it cannot write to
          # another one. A PAT is the only thing that can, which is also why the
          # loop guard in the gitops workflow cannot rely on GITHUB_TOKEN's
          # not-triggering behaviour.
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: write image tags
        env:
          REGISTRY_NS: ${{ secrets.DOCKERHUB_USERNAME }}
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          tag="${SHA::7}"
          for svc in $SERVICES; do
            chart="gitops/charts/${svc}"
            [ -d "$chart" ] || { echo "::error::no chart at ${chart}"; exit 1; }

            # A separate file, never values.yaml. values.yaml is what
            # `make up` reads on a laptop with no registry: pullPolicy Never and
            # a tag that was kind-loaded. Overwriting it with a sha that only
            # exists on Docker Hub breaks the local path for everyone.
            #
            # printf, not a heredoc: inside `run: |` every line carries the
            # block's indentation, and an indented delimiter never closes a
            # plain <<EOF — the step runs to the end of the script looking for
            # it and fails with an unexpected end of file.
            printf '%s\n' \
              "# Written by ${GITHUB_REPOSITORY}@${SHA}." \
              "# Generated — the next release overwrites this file." \
              "services:" \
              "  ${svc}:" \
              "    image:" \
              "      repository: ${REGISTRY_NS}/rabbit-${svc}" \
              "      tag: \"${tag}\"" \
              "      pullPolicy: IfNotPresent" \
              > "${chart}/values-ci.yaml"
          done
          git -C gitops diff --stat

      - name: commit and push
        working-directory: gitops
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          git config user.name "rabbit-ci"
          git config user.email "ci@rabbit.invalid"
          # Stage first, compare after. values-ci.yaml does not exist in the
          # gitops repo until the first promote writes it, and `git diff` on an
          # untracked file reports no change — the job then said "nothing to
          # promote" and exited 0 on the run that was supposed to create it.
          #
          # Named one by one rather than charts/*/values-ci.yaml: the glob would
          # also stage a file this run did not write.
          for svc in $SERVICES; do
            git add "charts/${svc}/values-ci.yaml"
          done
          if git diff --cached --quiet; then
            echo "no tag changed — nothing to promote"
            exit 0
          fi
          git commit -m "chore(images): api ${SHA::7} (${SERVICES})"
          # Another repo's promote may have landed between checkout and push.
          # Rebase and retry rather than fail the release over a race.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "::error::could not push to ${GITOPS_REPO} after 3 attempts"
          exit 1
